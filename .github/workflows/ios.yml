name: iOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to attach the unsigned IPA to Releases on tags

env:
  FLUTTER_VERSION: "3.47.2"
  IPA_NAME: "clouddock-ios-unsigned.ipa"

jobs:
  build:
    name: Build iOS IPA (unsigned)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: CocoaPods repo update (best effort)
        run: |
          cd ios
          pod repo update || true
          cd ..

      # Unsigned build for CI verification. Signed TestFlight/Store IPAs
      # require Apple signing secrets (see README "Device builds").
      - name: Build iOS app bundle (release, no codesign)
        run: flutter build ios --release --no-codesign

      # Package the unsigned .app as an .ipa (Payload/Runner.app zip).
      # Installable only after re-signing (AltStore/Sideloadly/TrollStore
      # or your own cert); stock devices reject unsigned IPAs.
      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/ios/iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "APP_PATH=$APP_PATH"
          test -n "$APP_PATH"
          rm -rf Payload "${{ env.IPA_NAME }}"
          mkdir Payload
          cp -R "$APP_PATH" "Payload/$(basename "$APP_PATH")"
          zip -r -y "${{ env.IPA_NAME }}" Payload
          unzip -l "${{ env.IPA_NAME }}" | head -8

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: clouddock-ios-ipa-${{ github.ref_name }}
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.IPA_NAME }}
