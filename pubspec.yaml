name: clouddock
description: "CloudDock - S3-compatible file browser for AWS S3, R2, MinIO, Wasabi, B2"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # S3 core
  http: ^1.2.2
  crypto: ^3.0.3
  xml: ^6.5.0
  path: ^1.9.0
  mime: ^2.0.0
  uuid: ^4.5.1
  intl: ^0.20.2

  # State + routing
  flutter_riverpod: ^2.5.1
  go_router: ^18.0.1

  # Storage + platform
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.4
  local_auth: ^2.3.0

  # Files + sharing
  file_picker: ^12.2.0
  image_picker: ^1.1.2
  share_plus: ^13.3.0
  open_filex: ^4.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
